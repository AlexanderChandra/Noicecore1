	    <div class="form-container-join">
    <div class="form-group-join">
      <label for="name">Name</label>
      <input type="text" id="name">
    </div>

    <div class="form-group-join">
      <label for="email">Email</label>
      <input type="email" id="email">
    </div>

    <div class="form-group-join">
      <label>Gender</label>
      <div class="gender-options-join">
        <label><input type="radio" name="gender"> Male</label>
        <label><input type="radio" name="gender"> Female</label>
      </div>
    </div>

    <div class="form-group-join">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob">
    </div>

    <div class="form-group-join">
      <label for="password">Password</label>
      <div class="password-group-join">
        <input type="password" id="password">
        <span class="eye-icon-join" onclick="toggleVisibility('password')">👁️</span>
      </div>
    </div>

    <div class="form-group-join">
      <label for="confirm">Konfirmasi Password</label>
      <div class="password-group-join">
        <input type="password" id="confirm">
        <span class="eye-icon-join" onclick="toggleVisibility('confirm')">👁️</span>
      </div>
    </div>

    <div class="terms-group-join">
      <input type="checkbox" id="terms">
      <label for="terms">I have read and agree to all the terms and conditions.</label>
    </div>
  </div>
  <div class="buttondata-all">
	<button class="buttondata" onclick="alert('Data Saved. Thankyou for joining us!')">Click Me</button>
  </div>
